namespace: integration

images:
  chains: gcr.io/stride-nodes/integration-tests/chains
  relayer: gcr.io/stride-nodes/integration-tests/relayer:v2.5.2
  hermes: gcr.io/stride-nodes/integration-tests/hermes:v1.9.0

# POA-swap rehearsal: Stride only, no host chains or relayers. Five nodes run, but only the
# first three are in the genesis POA set; v34's handler adds val4/val5 and removes val2/val3.
activeChains:
  - stride

relayers: []

chainConfigs:
  stride:
    binary: strided
    version: latest
    numValidators: 5
    poaGenesisValidators: 3
    poaValidatorPower: "274523"
    home: .stride
    denom: ustrd
    decimals: 6
  cosmoshub:
    binary: gaiad
    version: v22.1.0
    numValidators: 1
    home: .gaia
    denom: uatom
    decimals: 6
  osmosis:
    binary: osmosisd
    version: v28.0.0
    numValidators: 1
    home: .osmosisd
    denom: uosmo
    decimals: 6
